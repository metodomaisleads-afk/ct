<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corretor Turbo Studio — Inteligência Imobiliária</title>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #F7F6F2;
            --surface: #FFFFFF;
            --border: #E4E2DD;
            --border-dark: #2C2B29;
            --text-main: #1A1918;
            --text-muted: #66645F;
            --primary: #14452F;
            --primary-hover: #0D3020;
            --accent: #D94E28;
            --wa-bg: #E7F5E9;
            --wa-text: #075E54;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-canvas); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-badge { background: var(--primary); color: #fff; padding: 6px 10px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 14px; }
        .brand-title { font-size: 18px; font-weight: 700; color: var(--text-main); }
        .brand-subtitle { font-size: 12px; color: var(--text-muted); }

        .header-actions { display: flex; gap: 12px; align-items: center; }
        .badge-ambassador { background: #EBF3F0; color: var(--primary); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; border: 1px solid #C4D7CE; }
        .btn-plan { background: var(--border-dark); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .btn-plan:hover { background: var(--primary); }

        .main-container {
            max-width: 1440px;
            margin: 24px auto;
            padding: 0 24px;
            width: 100%;
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 24px;
            flex: 1;
        }

        @media (max-width: 1024px) {
            .main-container { grid-template-columns: 1fr; }
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .panel-title { font-size: 15px; font-weight: 700; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
        
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; letter-spacing: 0.5px; }
        .form-control { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; color: var(--text-main); background: #FAFAF9; transition: border 0.2s; }
        .form-control:focus { outline: none; border-color: var(--primary); background: #fff; }

        .workspace-content { display: flex; flex-direction: column; gap: 20px; }

        .nav-tabs {
            display: flex;
            gap: 8px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            overflow-x: auto;
        }
        .tab-btn { background: var(--surface); border: 1px solid var(--border); padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--text-muted); transition: all 0.2s; white-space: nowrap; }
        .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

        .tab-pane { display: none; }
        .tab-pane.active { display: block; }

        .card-output {
            background: var(--bg-canvas);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .card-output-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .card-output-title { font-size: 13px; font-weight: 700; color: var(--primary); }
        .hash-tag { font-family: 'JetBrains Mono', monospace; font-size: 11px; background: #E4E2DD; padding: 2px 6px; border-radius: 4px; color: var(--text-muted); }

            background: #EFEAE2;
            border-radius: 8px;
            padding: 14px;
            font-size: 13px;
            line-height: 1.5;
